name: Validate Listing Manifests

on:
  pull_request:
    paths:
      - "src/data/listings/**"
      - "scripts/validate-listings.ts"
      - "src/lib/catalog.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "src/data/listings/**"
      - "scripts/validate-listings.ts"
      - "src/lib/catalog.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate listing manifests
        run: npm run validate:listings
